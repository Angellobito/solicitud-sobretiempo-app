services:
  - type: web
    name: solicitud-sobretiempo
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: TREMOND_HOSTED
        value: "1"
      - key: TREMOND_ACCESS_KEY
        sync: false
      - key: TREMOND_APPROVAL_PASSWORD
        sync: false
      - key: TREMOND_DATA_DIR
        value: /var/data
      - key: TREMOND_PERSISTENT_STORAGE
        value: "0"
      - key: TREMOND_DATABASE_URL
        sync: false
